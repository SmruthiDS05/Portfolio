<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smruthi D Sharma · Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Fredoka:wght@600;700&family=Outfit:wght@600&family=Figtree:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=cabinet-grotesk@400,500,700,800,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFA;--ink:#111;--mut:#55555c;--pad:48px;--fd:'Clash Display','Outfit',system-ui,sans-serif;--fb:'Cabinet Grotesk','Figtree',system-ui,sans-serif;color-scheme:light}
@media(max-width:1024px){:root{--pad:24px}}@media(max-width:600px){:root{--pad:14px}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);overflow-x:clip;position:relative;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px var(--pad);gap:10px}
.logo{width:112px;mix-blend-mode:multiply;font:700 30px/1 'Fredoka',var(--fd);letter-spacing:-.5px;color:#111;text-decoration:none}
nav{display:flex;gap:30px}nav button{background:none;border:0;font:700 16px var(--fb);color:var(--ink);cursor:pointer;padding:6px 2px}
nav button:hover{text-decoration:underline;text-underline-offset:5px}
.talk{justify-self:end}
@media(max-width:600px){header{grid-template-columns:1fr auto}.logo{width:92px;font-size:25px}nav{grid-row:2;grid-column:1/-1;justify-content:center}}
.key{position:relative;display:inline-flex;align-items:center;height:54px;padding:0 28px 0 20px;border:0;border-radius:14px;font:600 17px var(--fd);cursor:pointer;text-decoration:none;box-shadow:0 7px 0 var(--side);transition:transform .28s cubic-bezier(.3,1.8,.5,1),box-shadow .28s;user-select:none;touch-action:manipulation;margin-bottom:7px}
.key:active,.key.dn{transform:translateY(5px);box-shadow:0 2px 0 var(--side);transition-duration:.05s}
.key small{position:absolute;top:5px;right:8px;font:700 10px var(--fb);opacity:.55}
.k1{background:#1c1c22;color:#fff;--side:#000}.k2{background:#fff;color:#111;--side:#c9c9d0}
main{position:relative;padding:10px var(--pad) 40px;min-height:calc(100vh - 90px);display:flex;flex-direction:column}
.copy{max-width:54%;position:relative;z-index:3}
.lab{display:flex;align-items:center;gap:8px;font:800 12px var(--fb);letter-spacing:.14em;color:var(--mut);margin:0 0 18px}.lab i{width:8px;height:8px;border-radius:50%;background:#ff2d33}
h1{font:600 clamp(42px,5vw,84px)/.98 var(--fd);letter-spacing:-.02em;margin:0 0 20px}
h1 em{font:italic 400 1.1em 'Instrument Serif',serif}
.sub{color:var(--mut);font-size:18px;margin:0 0 28px;max-width:44ch}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.cnt{font-size:14px;font-weight:700;color:var(--mut)}
.tray{position:relative;width:46%;margin-top:54px;flex:1;min-height:210px}
.tray b{font:800 11px var(--fb);letter-spacing:.14em;color:var(--mut)}
.gw{position:absolute;right:-2vw;top:2%;width:min(52vw,760px);filter:drop-shadow(0 34px 26px rgba(0,0,0,.22));z-index:2}
.gun{transform:rotate(-16deg);cursor:pointer;touch-action:manipulation}.gun svg{display:block;width:100%;height:auto;overflow:visible}
#trig{transition:transform .08s;transform-origin:510px 262px}#trig.pull{transform:rotate(-16deg)}
@media(max-width:700px){.copy{max-width:100%}.gw{position:relative;right:auto;top:auto;width:min(94%,520px);margin:34px auto 6px}.tray{width:100%;margin-top:26px;min-height:280px}}
.slip{position:absolute;left:0;top:0;pointer-events:none;z-index:6;will-change:transform;transition:opacity .3s}
.slip.arr{pointer-events:auto;cursor:pointer}
.paper{width:220px;height:84px;border-radius:7px;padding:0 14px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .2s;font-family:var(--fb)}
.paper.tag{width:88px;height:64px;padding:0 6px;align-items:center;text-align:center}
.w{font-weight:900;text-transform:uppercase;line-height:1;white-space:nowrap}.tag .w{white-space:normal;font-size:15px}
.s{font-size:10px;letter-spacing:.14em;margin-top:6px;opacity:.78;font-weight:700}
.arr:hover .paper{transform:translateY(-6px)}.hop{animation:hop .35s}@keyframes hop{40%{transform:translateY(-8px)}}
.card{position:fixed;right:var(--pad);bottom:max(22px,env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 28px));padding:18px 20px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.06);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.12);z-index:20;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card small{font:800 11px var(--fb);letter-spacing:.14em;color:var(--mut)}.card h3{font:600 26px/1.05 var(--fd);margin:6px 0 8px}.card p{margin:0;font-size:15px;line-height:1.4;color:var(--mut)}
.card a{display:inline-block;margin-top:10px;font-weight:800;color:var(--ink)}.card .x{position:absolute;top:8px;right:12px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut)}
:focus-visible{outline:3px solid #3f6bff;outline-offset:3px}
</style></head>
<body>
<header>
  <!-- stand-in wordmark: swap for <img src="logo.png"> once you have the file -->
  <a class="logo" href="#" aria-label="smruthi">smruthi</a>
  <nav><button data-g="work">Work</button><button data-g="about">About</button><button data-g="process">Process</button><button data-g="contact">Contact</button></nav>
  <a class="key k2 talk" href="mailto:smruthisharma2003@gmail.com">Let’s Talk ↗<small>@</small></a>
</header>
<main>
  <div class="copy">
    <p class="lab"><i></i>PORTFOLIO · 2026</p>
    <h1>Hi, I’m <em>Smruthi,</em> a data analyst with a curious mind.</h1>
    <p class="sub">My work comes out of this gun. Pull the trigger and catch a slip.</p>
    <div class="row">
      <button class="key k1" id="sp">Spray my work<small>⏎</small></button>
      <button class="key k2" id="clean">Clean up<small>↺</small></button>
      <span class="cnt"><span id="n">0</span> slips sprayed</span>
    </div>
  </div>
  <div class="gw"><div class="gun" id="gun">
<svg viewBox="0 0 800 440" role="img" aria-label="Red paper money gun with PORTFOLIO printed on its side">
<defs>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#ff5a5e"/><stop offset="1" stop-color="#ff3a40"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3f"/><stop offset=".55" stop-color="#e0141c"/><stop offset="1" stop-color="#a50a10"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c00d14"/><stop offset="1" stop-color="#7d050a"/></linearGradient>
<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3036"/><stop offset=".5" stop-color="#d9121a"/><stop offset="1" stop-color="#9c080e"/></linearGradient>
</defs>
<g id="gk">
<path d="M468 260V318Q468 346 496 346H552" fill="none" stroke="#c9121a" stroke-width="10" stroke-linecap="round"/>
<polygon points="610,260 650,226 700,376 655,410" fill="#7a050a"/>
<polygon points="500,260 610,260 655,410 545,410" fill="url(#gg)"/>
<line x1="514" y1="270" x2="554" y2="402" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
<polygon points="700,120 740,84 740,224 700,260" fill="url(#gb)"/>
<polygon points="100,120 140,84 740,84 700,120" fill="url(#gt)"/>
<rect x="100" y="120" width="600" height="140" rx="3" fill="url(#gs)"/>
<rect x="104" y="121" width="592" height="3" rx="1.5" fill="#fff" opacity=".85"/>
<line x1="270" y1="130" x2="270" y2="252" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
<line x1="550" y1="130" x2="550" y2="252" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
<g fill="#5a0509"><circle cx="128" cy="138" r="5"/><circle cx="672" cy="138" r="5"/><circle cx="128" cy="244" r="5"/><circle cx="672" cy="244" r="5"/></g>
<rect id="slot" x="102" y="156" width="40" height="56" rx="5" fill="#1b0306"/>
<text x="410" y="207" text-anchor="middle" font-family="'Cabinet Grotesk','Figtree',sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="#fff">PORTFOLIO</text>
<polygon id="trig" points="498,262 522,262 514,316 500,312" fill="#8a060b"/>
</g></svg></div></div>
  <div class="tray" id="tray"><b>WHAT CAME OUT · CLICK A SLIP</b></div>
</main>
<div class="card" id="card" role="status"><button class="x" aria-label="Close">×</button><small></small><h3></h3><p></p></div>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const D=[
["pizza","Pizza sales","Project 01","SQL on a 4-table database: joins, CTEs and window functions reveal the top 5 revenue items and the peak demand hours.","work"],
["diwali","Diwali EDA","Project 02","Python and Pandas segmentation. The top buyers: married women under 35 in IT and healthcare.","work"],
["dash","Dashboard","Project 03","A Power BI sales dashboard with 8–10 visuals, DAX revenue KPIs, segment drill-down and an automated refresh.","work"],
["navi","Navigator","Project 04","A real-time obstacle detection prototype for visually impaired users, built with Python, OpenCV and a Raspberry Pi.","work"],
["me","Smruthi","Data analyst","Electronics graduate turned data analyst. SQL, Python, Power BI and a habit of asking why.","about"],
["rs","R&S","Rohde & Schwarz","Engineer trainee, Jul 2025 – Mar 2026. Found 3–4 recurring error patterns in test data so engineers could cut re-testing.","about"],
["aad","Aaditi","IoT data analyst","EDA on IIIT-Bengaluru sensor data to spot stability trends, with daily and weekly Excel summaries.","about"],
["gpa","9.23 GPA","B.E. E&TC · MSRIT","Electronics & Telecommunications at M S Ramaiah Institute of Technology, 2025.","about"],
["time","30 min","Review time, was ~1 hr","Refined reporting formats with engineers across 10–15 files a week.","about"],
["clean","Clean","Step 01","Fix the mess first: types, duplicates, gaps and outliers.","process"],
["check","Validate","Step 02","Check the data with the people who know it, then trace the root cause.","process"],
["tell","Report","Step 03","Turn numbers into dashboards and summaries people can act on.","process"],
["mail","Email","Say hello","smruthisharma2003@gmail.com","contact","mailto:smruthisharma2003@gmail.com"],
["li","LinkedIn","Smruthi D Sharma","Let’s connect.","contact","https://linkedin.com/in/smruthi-d-sharma-22913b279"],
["gh","GitHub","SmruthiDS05","The code behind the projects.","contact","https://github.com/SmruthiDS05"]];
const K={};D.forEach(d=>K[d[0]]={id:d[0],word:d[1],sub:d[2],detail:d[3],group:d[4],href:d[5]});
const tags=["SQL","Python","Power BI","Excel","DAX","Pandas","2026"].map(t=>K["t"+t]={id:"t"+t,word:t,sub:"Toolkit",detail:"Part of my everyday toolkit.",tag:1});
const bigs=D.map(d=>K[d[0]]).sort(()=>Math.random()-.5);
const P=["#ff5fa8","#ffd23f","#3f6bff","#3fe0a8","#ff8a2a","#8b5cff","#c8f03c","#5cc8ff","#1c1c22","#ffffff"],col={};let ci=0;
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
const tray=$("#tray"),card=$("#card"),gk=$("#gk"),trig=$("#trig"),GL=RM?350:700;
let slots=[],placed={},live=new Set,L={pos:{}},running=false,shot=0,bi=0,ti=0,count=0,iv=null,tt;
const lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const T=(el,x,y,r,f,s)=>el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) perspective(700px) rotate(${r}deg) rotateX(${f}deg) scale(${s})`;
const place=(el,p)=>p&&!el._live&&T(el,p.x,p.y,0,0,p.s);
function mk(k){
  if(!col[k.id])col[k.id]=P[ci++%P.length];const c=col[k.id];
  const el=document.createElement("div");el.className="slip";el.dataset.id=k.id;
  const p=document.createElement("div");p.className="paper"+(k.tag?" tag":"");
  p.style.cssText=`background:${c};color:${lum(c)<.5?"#fff":"#15151a"}`+(c=="#ffffff"?";border:1px solid #e3e3e8":"");
  const w=document.createElement("span");w.className="w";w.textContent=k.word;p.append(w);
  if(!k.tag){w.style.fontSize=(k.word.replace(/[^a-z0-9]/gi,"").length>9?25:30)+"px";const s=document.createElement("span");s.className="s";s.textContent=k.sub;p.append(s)}
  el.append(p);document.body.append(el);return el}
function layout(){
  const r=tray.getBoundingClientRect(),X=r.left+scrollX,Y=r.top+scrollY+26,W=r.width,H=Math.max(80,r.height-30);let h=58,pos;
  for(;;){pos={};let x=0,y=0;
    for(const id of slots){const k=K[id],w=k.tag?h*88/64:h*220/84;if(x+w>W&&x>0){x=0;y+=h+10}pos[id]={x:X+x+w/2,y:Y+y+h/2,s:h/(k.tag?64:84)};x+=w+10}
    if(y+h<=H||h<=28)break;h-=3}
  L.pos=pos;for(const id in placed)place(placed[id],pos[id])}
function fire(k){
  const m=$("#slot").getBoundingClientRect(),el=mk(k),a=rnd(150,190)*Math.PI/180,v=rnd(9,17);el._live=1;
  const o={el,k,m:"fly",x:m.left+m.width/2+scrollX,y:m.top+m.height/2+scrollY,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,rot:rnd(-30,30),vr:rnd(-6,6),ph:rnd(0,6.28),t0:performance.now(),dur:rnd(700,1100)/(RM?2.2:1),f:0};
  live.add(o);T(el,o.x,o.y,o.rot,0,1);count++;$("#n").textContent=count;
  gk.animate([{transform:"translate(14px,0)"},{transform:"translate(0,0)"}],{duration:RM?90:190,easing:"ease-out"});
  trig.classList.add("pull");clearTimeout(tt);tt=setTimeout(()=>trig.classList.remove("pull"),130);
  if(!running){running=true;requestAnimationFrame(tick)}}
function tick(now){
  for(const o of [...live]){
    if(o.m=="fly"){const age=now-o.t0;
      o.vy=Math.min(o.vy+.28,5);o.vx*=.975;o.x+=o.vx+Math.sin(age*.012+o.ph)*1.4;o.y+=o.vy;o.rot+=o.vr;o.f=55*Math.sin(age*.009+o.ph);
      T(o.el,o.x,o.y,o.rot,o.f,1);
      if(age>o.dur){o.m="glide";o.g=now;o.a={x:o.x,y:o.y,r:o.rot,f:o.f};o.dup=slots.includes(o.k.id);
        if(!o.dup){slots.push(o.k.id);placed[o.k.id]=o.el;layout()}}
    }else{
      const p=Math.min(1,(now-o.g)/GL),e=1-(1-p)**3,t=L.pos[o.k.id],rt=Math.round(o.a.r/360)*360;
      if(!t){live.delete(o);continue}
      T(o.el,lerp(o.a.x,t.x,e),lerp(o.a.y,t.y,e),lerp(o.a.r,rt,e),lerp(o.a.f,0,e),lerp(1,t.s,e));
      if(p>=1){live.delete(o);o.el._live=0;
        if(o.dup){o.el.style.opacity=0;setTimeout(()=>o.el.remove(),320);const tw=placed[o.k.id];
          if(tw){const q=tw.firstChild;q.classList.remove("hop");void q.offsetWidth;q.classList.add("hop")}}
        else{o.el.classList.add("arr");place(o.el,t)}}}}
  live.size?requestAnimationFrame(tick):running=false}
function next(){shot++;return shot%4?bigs[bi++%bigs.length]:tags[ti++%tags.length]}
const spray=()=>fire(next());
function start(){if(iv)return;spray();iv=setInterval(spray,RM?220:85)}
function stop(){clearInterval(iv);iv=null}
function show(k){card.querySelector("small").textContent=k.sub.toUpperCase();card.querySelector("h3").textContent=k.word;
  const p=card.querySelector("p");p.textContent=k.detail;card.querySelector("a")?.remove();
  if(k.href){const a=document.createElement("a");a.href=k.href;a.target="_blank";a.rel="noopener";a.textContent="Open ↗";card.append(a)}
  card.classList.add("on")}
function clean(){live.clear();slots=[];placed={};L.pos={};
  document.querySelectorAll(".slip").forEach(s=>{s.style.opacity=0;s.style.pointerEvents="none";setTimeout(()=>s.remove(),320)})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  const l=D.filter(d=>d[4]==b.dataset.g).map(d=>K[d[0]]);let i=0;show(l[0]);
  const t=setInterval(()=>{fire(l[i++]);if(i>=l.length)clearInterval(t)},90)});
$("#sp").addEventListener("pointerdown",e=>{e.preventDefault();start()});
$("#gun").addEventListener("pointerdown",e=>{e.preventDefault();start()});
addEventListener("pointerup",stop);addEventListener("pointercancel",stop);
$("#clean").onclick=clean;card.querySelector(".x").onclick=()=>card.classList.remove("on");
document.addEventListener("click",e=>{const s=e.target.closest(".slip.arr");if(s)show(K[s.dataset.id])});
addEventListener("keydown",e=>{if(e.repeat)return;const t=e.target;
  if(e.code=="Space"||(e.key=="Enter"&&(t==$("#sp")||t==document.body))){if(t.closest("a,nav button,#clean,.x"))return;e.preventDefault();$("#sp").classList.add("dn");start()}});
addEventListener("keyup",e=>{if(e.code=="Space"||e.key=="Enter"){stop();$("#sp").classList.remove("dn")}});
addEventListener("resize",layout);
setTimeout(()=>{let n=0;const t=setInterval(()=>{spray();if(++n>=20)clearInterval(t)},95)},700);
</script></body></html>
